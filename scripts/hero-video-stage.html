<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;width:960px;height:800px;overflow:hidden;background:#edf4ff;font-family:Arial,sans-serif}.scene{isolation:isolate;position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 75% 20%,white 0,#edf4ff 45%,#d3e2ff 100%)}.lifestyle{width:100%;height:100%;object-fit:cover}.wash{background:radial-gradient(ellipse at 50% 35%,#fff 5%,#eff5ff 50%,#dbe8ff 100%)}.cool{background:radial-gradient(ellipse at 60% 40%,#fff 10%,#e9f3f8 60%,#d3e6f5 100%)}.halo{position:absolute;left:160px;top:150px;width:650px;height:650px;border-radius:50%;border:1px solid #2458c418;background:#ffffff30}.halo:after{content:'';position:absolute;inset:50px;border:1px solid #2458c414;border-radius:50%}.copy{position:absolute;top:58px;left:58px;right:40px;z-index:5}.tag{font-size:16px;letter-spacing:4px;color:#2458c4;font-weight:700;margin-bottom:16px}.title{font-size:46px;line-height:1.15;letter-spacing:-1.8px;color:#153a6c;font-weight:700}.product{position:absolute;object-fit:contain;mix-blend-mode:multiply;transform-origin:50% 80%;filter:drop-shadow(0 16px 14px #18395c14)}.wash .one{left:20px;top:245px;width:310px;height:390px}.wash .two{left:260px;top:200px;width:420px;height:460px}.wash .three{left:590px;top:260px;width:330px;height:380px}.cool .one{left:35px;top:240px;width:270px;height:420px}.cool .two{left:325px;top:195px;width:290px;height:470px;mix-blend-mode:normal}.cool .three{left:580px;top:340px;width:350px;height:260px}.bottom-glow{position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(transparent,#dce9ff70)}.beam{position:absolute;width:320px;height:1000px;background:linear-gradient(90deg,transparent,#ffffff60,transparent);transform:rotate(20deg);top:-100px;pointer-events:none}</style></head><body>
<div class="scene" id="life"><img class="lifestyle" src="../assets/img/catalogue/maison.webp"></div>
<div class="scene wash" id="wash"><div class="halo"></div><div class="copy"><div class="tag">FRESH & GÉANT · SMART HOME GROUP</div><div class="title">Le soin du linge.<br>Le confort au quotidien.</div></div><img class="product one" src="../assets/img/catalogue/produit-01-hd.png"><img class="product two" src="../assets/img/catalogue/produit-08-hd.png"><img class="product three" src="../assets/img/catalogue/produit-25.webp"><div class="bottom-glow"></div><div class="beam"></div></div>
<div class="scene cool" id="cool"><div class="halo"></div><div class="copy"><div class="tag">VOTRE MAISON, BIEN ÉQUIPÉE.</div><div class="title">De la fraîcheur.<br>À chaque instant.</div></div><img class="product one" src="../assets/img/catalogue/fresh-fr-tu40-blanc-transparent.png"><img class="product two" src="../assets/img/catalogue/geant-bcd435-ferme-transparent.png"><img class="product three" src="../assets/img/catalogue/produit-13.webp"><div class="bottom-glow"></div><div class="beam"></div></div>
<script>const clamp=x=>Math.min(1,Math.max(0,x));const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};window.draw=t=>{const life=document.querySelector('#life'),wash=document.querySelector('#wash'),cool=document.querySelector('#cool');wash.style.opacity=smooth((t-4)/1);cool.style.opacity=smooth((t-9)/1)*(1-smooth((t-14)/1));wash.style.opacity=Number(wash.style.opacity)*(1-smooth((t-14)/1));document.querySelector('.lifestyle').style.transform='scale('+(1.02+.045*Math.sin(Math.PI*t/15))+') translateX('+(-8*Math.sin(Math.PI*t/15))+'px)';document.querySelectorAll('.product').forEach((e,i)=>{const phase=t*.55+i*.9;e.style.transform='translateY('+(Math.sin(phase)*9)+'px) scale('+(1+.008*Math.sin(phase))+')'});document.querySelectorAll('.copy').forEach((e,i)=>e.style.transform='translateY('+(-4*Math.sin(t*.4+i))+'px)');document.querySelectorAll('.beam').forEach(e=>e.style.left=(-500+t*110)+'px');};draw(0);</script></body></html>
