<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;width:960px;height:800px;overflow:hidden;background:#edf5ff;font-family:Arial,sans-serif}.studio{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 38%,white 8%,#edf5ff 55%,#d6e7ff 100%)}.orbit{position:absolute;left:90px;top:90px;width:780px;height:780px;border:2px solid #8bb7ec35;border-radius:50%;box-shadow:0 0 100px #c9e4ff50}.orbit:before{content:'';position:absolute;inset:55px;border:1px solid #7faee82c;border-radius:50%}.orbit:after{content:'';position:absolute;top:104px;left:104px;width:18px;height:18px;background:#39b9e6;border-radius:50%;box-shadow:0 0 30px #62cfff}.floor{position:absolute;left:160px;top:600px;width:680px;height:55px;background:radial-gradient(ellipse,#5278ac20,transparent 70%)}.scene{position:absolute;inset:0;isolation:isolate;opacity:0}.scene:not(.life){background:radial-gradient(ellipse at 55% 38%,white 8%,#edf5ff 55%,#d6e7ff 100%)}.life{overflow:hidden}.life img{width:100%;height:100%;object-fit:cover}.copy{position:absolute;left:54px;top:68px;z-index:4;max-width:500px}.eyebrow{font-size:14px;letter-spacing:3px;color:#2458c4;font-weight:700;margin-bottom:14px}.copy h2{font-size:54px;letter-spacing:-2px;line-height:1.02;color:#153a6c;margin:0}.copy p{font-size:20px;color:#427298;margin:18px 0}.appliance{position:absolute;object-fit:contain;mix-blend-mode:multiply;transform-origin:50% 75%}.washer{left:330px;top:150px;width:560px;height:550px}.fridge{left:390px;top:115px;width:430px;height:570px;mix-blend-mode:normal}.open-fridge{left:350px;width:520px}.cooler{left:290px;top:120px;width:380px;height:590px;mix-blend-mode:normal}.air{position:absolute;inset:0;width:960px;height:800px;opacity:.65}.air path{fill:none;stroke:#48b5dc;stroke-width:3;stroke-linecap:round;stroke-dasharray:80 40}.water-ring{position:absolute;left:540px;top:380px;width:170px;height:170px;border:3px solid #62c9ec75;border-radius:50%;pointer-events:none}.water-ring:after{content:'';position:absolute;inset:25px;border:2px solid #62c9ec60;border-radius:50%}.ensemble .copy{top:60px}.ensemble .copy h2{font-size:45px}.ensemble .a{left:10px;top:300px;width:300px;height:360px}.ensemble .b{left:325px;top:170px;width:260px;height:500px;mix-blend-mode:normal}.ensemble .c{left:590px;top:220px;width:300px;height:460px;mix-blend-mode:normal}.light{position:absolute;top:-200px;width:240px;height:1200px;background:linear-gradient(90deg,transparent,#ffffff90,transparent);transform:rotate(22deg);pointer-events:none;z-index:10}.wash .copy{max-width:370px}.cool .copy{top:90px;max-width:310px}.cool .copy h2{font-size:49px}.accent{color:#2458c4}</style></head><body><div class="studio"></div><div class="orbit"></div><div class="floor"></div>
<section class="scene life" id="life"><img src="../assets/img/catalogue/maison.webp"></section>
<section class="scene wash" id="wash"><div class="copy"><div class="eyebrow">LE QUOTIDIEN, EN MIEUX.</div><h2>Le soin<br><span class="accent">du linge.</span></h2></div><img class="appliance washer" src="../assets/img/catalogue/produit-08-hd.png"><div class="water-ring"></div></section>
<section class="scene cold" id="cold"><div class="copy"><div class="eyebrow">DE LA PLACE POUR VOS ENVIES.</div><h2>Tout<br><span class="accent">conserver.</span></h2></div><img class="appliance fridge closed-fridge" src="../assets/img/catalogue/geant-bcd435-ferme-transparent.png"><img class="appliance fridge open-fridge" src="../assets/img/catalogue/geant-bcd435-ouvert-transparent.png"></section>
<section class="scene cool" id="cool"><div class="copy"><div class="eyebrow">PLACE AU CONFORT.</div><h2>Un souffle<br><span class="accent">de fraîcheur.</span></h2></div><img class="appliance cooler" src="../assets/img/catalogue/fresh-fr-tu40-blanc-transparent.png"><svg class="air" viewBox="0 0 960 800"><path d="M560 325C650 240 760 340 950 235"/><path d="M560 375C690 300 780 410 970 350"/><path d="M560 425C680 400 800 500 980 455"/></svg></section>
<section class="scene ensemble" id="ensemble"><div class="copy"><div class="eyebrow">SMART HOME GROUP · FRESH & GÉANT</div><h2>Votre maison.<br><span class="accent">Notre attention.</span></h2></div><img class="appliance a" src="../assets/img/catalogue/produit-01-hd.png"><img class="appliance b" src="../assets/img/catalogue/geant-bcd435-ferme-transparent.png"><img class="appliance c" src="../assets/img/catalogue/fresh-fr-tu25-noir-transparent.png"></section><div class="light"></div>
<script>
const el=id=>document.getElementById(id),clamp=x=>Math.min(1,Math.max(0,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},ease=x=>1-Math.pow(1-clamp(x),3);
function scene(id,t,start,end){const enter=smooth((t-start)/.35),exit=smooth((t-end)/.35);el(id).style.opacity=enter*(1-exit);return t-start;}
window.draw=t=>{document.querySelector('.orbit').style.transform='rotate('+(t*25)+'deg) scale('+(1+.035*Math.sin(t*2))+')';document.querySelector('.light').style.left=(-700+(t%2.4)/2.4*2100)+'px';
const life=el('life');life.style.opacity=t<1.45?1-smooth((t-1.05)/.4):smooth((t-9.35)/.65);document.querySelector('.life img').style.transform='scale('+(t<2?1.02+t*.1:1.02+(10-t)*.1)+') translateX('+(t<2?-t*14:-(10-t)*14)+'px)';
let u=scene('wash',t,1.05,3.0);document.querySelector('.washer').style.transform='translateX('+((1-ease(u/.6))*250-u*22)+'px) scale('+(1+u*.035)+')';el('wash').querySelector('.copy').style.transform='translateX('+(-35*(1-ease(u/.5)))+'px)';const ring=document.querySelector('.water-ring');ring.style.transform='scale('+(1+(u% .8)*.5)+')';ring.style.opacity=.5*(1-clamp((u%.8)/.8));
u=scene('cold',t,3.0,5.0);const opening=smooth((u-.7)/.55);document.querySelector('.closed-fridge').style.clipPath='inset(0 '+(opening*100)+'% 0 0)';document.querySelector('.open-fridge').style.clipPath='inset(0 0 0 '+((1-opening)*100)+'%)';document.querySelectorAll('.fridge').forEach(e=>e.style.transform='translateX('+((1-ease(u/.5))*170-u*16)+'px) scale('+(1+u*.04)+')');
u=scene('cool',t,5.0,7.0);document.querySelector('.cooler').style.transform='translateX('+((1-ease(u/.5))*190-u*10)+'px) scale('+(1+u*.045)+')';document.querySelectorAll('.air path').forEach((e,i)=>e.style.strokeDashoffset=(-u*400-i*90));
u=scene('ensemble',t,7.0,9.35);document.querySelectorAll('.ensemble .appliance').forEach((e,i)=>{const progress=ease((u-i*.12)/.6);e.style.opacity=progress;e.style.transform='translateY('+((1-progress)*100-8*Math.sin(u*1.7+i))+'px) scale('+( .92+.08*progress)+')'});
};draw(0);
</script></body></html>
